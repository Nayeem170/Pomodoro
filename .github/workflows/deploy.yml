name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to deploy'
        required: true
        default: 'develop'
        type: choice
        options:
          - develop
          - main

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.ref || inputs.branch }}

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Packages.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - run: dotnet restore Pomodoro.sln
      - run: dotnet build Pomodoro.sln --configuration Release --no-restore
      - run: dotnet publish src/Pomodoro.Web -c Release -o ./publish

      - uses: actions/upload-artifact@v4
        with:
          name: publish
          path: publish/wwwroot
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ ((github.event_name == 'push' && github.ref_name == 'main') || (github.event_name == 'workflow_dispatch' && inputs.branch == 'main')) && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: publish
          path: publish/wwwroot

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: tarkeez
          branch: ${{ github.event_name == 'push' && github.ref_name || inputs.branch }}
          directory: publish/wwwroot

      - name: Provision custom domain (production only)
        if: github.event_name == 'push' && github.ref_name == 'main'
        env:
          PROJECT_NAME: tarkeez
          CUSTOM_DOMAIN: tarkeez.bitops.bd
          ZONE_NAME: bitops.bd
          CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          chmod +x scripts/provision-pages-domain.sh
          bash scripts/provision-pages-domain.sh
